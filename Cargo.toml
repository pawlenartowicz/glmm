[package]
name = "glmm"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Standalone f64 GLMM fit kernels (OLS, GLM, LMM, GLMM) in pure Rust on faer — the parity-pinned numerics from the MCPower engine."
keywords = ["statistics", "glmm", "regression", "mixed-models", "mle"]
categories = ["science", "mathematics"]
repository = "https://github.com/pawlenartowicz/glmm"

[lib]
crate-type = ["rlib"]

# The glmm side of the cross-language parity harness. Kept at parity/oracle/fit.rs
# (where the design and run.sh name it) rather than the default examples/ dir; an
# ordinary part of the crate build, run by run.sh's "rust" engine entry. Uses the
# serde_json dev-dependency (examples see dev-deps).
[[example]]
name = "parity_fit"
path = "parity/oracle/fit.rs"

[lints]
workspace = true

[features]
# Unstable scratch-explicit hot-path surface (the loop tier: scratch-explicit
# kernels + `StartValues` warm-start). Capability-named, multi-consumer. OFF by
# default so the semver-covered public API is just `fit` + `ModelSpec`. (spec §5)
loop_advanced = []

[dependencies]
# Mirror engine-core's pins exactly — parity-stable numerics depend on them.
bobyqa = "0.1"
pulp = "=0.22.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = "0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dhat       = "0.3"
# The formula frontend, used only by the parity example (`parity/oracle/fit.rs`)
# to build design/spec/ids from a formula string instead of by hand. A
# dev-dependency, so this glmm→glmm-formula→glmm edge is a permitted dev-only
# cycle (Cargo allows cycles through dev-deps) and never enters the published
# lib's dependency graph — the parse-once/fit-many hot path still links no `regex`.
glmm-formula = { path = "glmm-formula" }

# ───────────────────────── standalone workspace root ─────────────────────────
# glmm was carved out of the mcpower workspace (Stage 2). It is now its own
# single-crate workspace so the `.workspace = true` inheritances above resolve
# here, and the clippy/unsafe lint gate carried over from mcpower stays in one
# place. Values copied verbatim from the mcpower workspace at carve time.
[workspace]
resolver = "2"
# The `glmm` root package is the kernel (formula-free, parse-once/fit-many hot
# path). `glmm-formula` (d3) is the R-style formula frontend that lowers a
# formula + data table into the numeric inputs `fit_cold` consumes; it depends on
# `glmm`, never the reverse, so the kernel never links `regex`/the parser.
# `glmm-python` (Python wiring) depends on both and is the only crate that links
# `pyo3`; `publish = false` — it is a PyO3/maturin extension, never `cargo publish`ed.
members = ["glmm-formula", "glmm-python"]

[workspace.package]
edition = "2021"
rust-version = "1.85"      # floor set by the bobyqa dep (edition 2024, MSRV 1.85)
license = "GPL-3.0-or-later"

[workspace.lints.rust]
# glmm is pure-Rust and uses no `unsafe`; this baseline matches the mcpower
# engine crates (which harden further to forbid in lib.rs — glmm does not).
unsafe_code = "warn"

[workspace.lints.clippy]
# priority -1 lets item-level #[allow]/#[expect] override; deny makes clippy::all
# a correctness gate that fails a plain `cargo clippy` — the parity-numeric guard
# this crate shipped with inside mcpower.
all = { level = "deny", priority = -1 }

# Match the mcpower release profile so glmm's OWN release/bench builds keep the
# codegen (lto + single codegen-unit) that the bobyqa/pulp version-pin comments
# tie the fitted-MLE low bits / goldens to. Ignored when glmm is consumed as a
# dependency (the consumer's profile wins), so it does not affect the mcpower
# build path — only standalone `cargo build --release` / benchmarks in this repo.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false
