# ───────────────────────── standalone workspace root ─────────────────────────
# glmm was carved out of the mcpower workspace (Stage 2). This virtual workspace
# holds the shared package fields, lints and profiles, so the members'
# `.workspace = true` inheritances resolve here and the clippy/unsafe lint gate
# carried over from mcpower stays in one place. Values copied verbatim from the
# mcpower workspace at carve time.
[workspace]
resolver = "2"
# `glmm-rs` (package `glmm`) is the kernel plus, behind the default-on `formula`
# feature, the R-style formula frontend that lowers a formula + data table into
# the numeric inputs `fit` consumes. `glmm-py` (package `glmm-python`, Python
# wiring) is the only crate that links `pyo3`; `publish = false`: it is a
# PyO3/maturin extension, never `cargo publish`ed. `glmm-r/rust` (package
# `glmm-r`) is its R-side twin (extendr wiring), re-exported by `glmm-r/src/rust`
# (which stays OUT of this workspace: R drives that staticlib build with its own
# resolver, mirroring mcpower's ports/r layout). `validation` is the
# publish = false crate owning the oracle-harness examples, outside the packaged
# glmm crate.
members = ["glmm-rs", "glmm-bind", "glmm-py", "glmm-r/rust", "validation"]
# A bare `cargo test` / `cargo check` at the root means the engine alone, and
# does not pull in PyO3 or extendr, which need Python and R headers.
default-members = ["glmm-rs"]

[workspace.package]
edition = "2021"
rust-version = "1.85"      # floor set by the bobyqa dep (edition 2024, MSRV 1.85)
license = "LGPL-3.0-or-later"

[workspace.lints.rust]
# glmm is pure-Rust and uses no `unsafe`; this baseline matches the mcpower
# engine crates (which harden further to forbid in lib.rs — glmm does not).
unsafe_code = "warn"

[workspace.lints.clippy]
# priority -1 lets item-level #[allow]/#[expect] override; deny makes clippy::all
# a correctness gate that fails a plain `cargo clippy` — the validation-numeric guard
# this crate shipped with inside mcpower.
all = { level = "deny", priority = -1 }

# Match the mcpower release profile so glmm's OWN release/bench builds keep the
# codegen (lto + single codegen-unit) that the bobyqa/pulp version-pin comments
# tie the fitted-MLE low bits / goldens to. Ignored when glmm is consumed as a
# dependency (the consumer's profile wins), so it does not affect the mcpower
# build path — only standalone `cargo build --release` / benchmarks in this repo.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

# Optimize test builds: the suite is dominated by faer/BOBYQA/PIRLS numerics
# that run 30-60x slower unoptimized (the sparse NB GLMM test alone is ~24 s
# optimized, tens of minutes at opt-level 0). Debug assertions stay on. The
# release-profile validation pins above are untouched — goldens are tolerance
# checks, not bit-exact, under test profiles.
[profile.test]
opt-level = 3

# Dependencies of test builds compile under profile.dev, not profile.test, so
# faer/bobyqa need their own override to be optimized in `cargo test`.
[profile.dev.package."*"]
opt-level = 3
