[package]
name = "glmm-bind"
version = "0.9.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Language-neutral half of the glmm ports: one call() entry point, argument checks, defaults, result records and error codes, used by the Python and R wrappers."

[dependencies]
glmm = { path = "../glmm-rs", features = ["orchestrate"] }
# erfc of the summary's Wald z p-values; adds no package (the engine uses it).
libm = "0.2.16"

[lints]
workspace = true
