[package]
name = "validation"
# Lockstep with the crate: must equal GLMM/Cargo.toml [package] version.
# grid/engines/glmm.rs stamps CARGO_PKG_VERSION into each result record's
# engine_version, and that macro reads THIS manifest, not glmm's.
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Dev/CI-only cross-language oracle harness — never distributed. Being a nested
# package is also what keeps everything under validation/ out of `cargo package
# -p glmm`: Cargo never descends into a subdirectory with its own Cargo.toml.
publish = false

# No lib/bin — this package exists only to own the example targets below (examples
# satisfy Cargo's at-least-one-target requirement).

# `formula` — the drivers lower R-style formulas; `loop_advanced` — theta_eval
# drives the dev-only seam. Enabled here on the dep rather than per-example
# `required-features` so every example always builds (and stays under the
# workspace clippy deny gate) in `cargo clippy --workspace --all-targets`.
[dependencies]
glmm = { path = "..", features = ["formula", "loop_advanced"] }

# Dev-only pass-through of the kernel's optimizer counters, for the speed
# grid's counter pass. OFF by default: the counters perturb wall time
# slightly, and every other pass of this campaign reads wall time.
[features]
counters = ["glmm/counters"]

# No `parallel` passthrough: every example here fits serial. The one that wants
# inner parallelism, campaigns/speed-campaign/agq_par_probe.rs, asks for it on the
# dependency directly (`--features glmm/parallel`, see its header).

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

# The glmm side of the optimizer-grid campaign (campaigns/speed-campaign/manifest.json,
# 585 cells): one JSONL record per cell, appended to $GRID_OUT. Shares
# tools/common.rs with the examples below.
[[example]]
name = "grid_fit"
path = "campaigns/speed-campaign/fit.rs"

# Mismatch-adjudication driver: evaluates/minimizes the LMM profiled-REML objective
# at caller-chosen θ/schedules through the dev-only loop_advanced seam.
[[example]]
name = "theta_eval"
path = "campaigns/speed-campaign/theta_eval.rs"

# Fits one memory-measurement model (tools/memory/models.json + gen_models.py) from a
# CSV path + formula string, for the memory harness (tools/memory/memory.sh) to wrap
# in `/usr/bin/time -f '%M'`. Not a validation gate -- see tools/memory/models.json's
# header.
[[example]]
name = "memory_fit"
path = "tools/memory/memory_fit.rs"

# AGQ parallel_inner probe (see its header).
[[example]]
name = "agq_par_probe"
path = "campaigns/speed-campaign/agq_par_probe.rs"

# Machine-local bit-identity baseline for refactors that must not change any
# fitted number: fits all 49 manifest rungs and writes
# tools/bit_identity/<config>.json (rung, deviance, theta, beta, se_hessian, se_rx,
# n_eval, converged, singular). See tools/bit_identity/dump.rs's header for the
# four config commands.
[[example]]
name = "bit_identity"
path = "tools/bit_identity/dump.rs"

# The glmm side of the accuracy grid (grid/manifest.json): one JSONL record per
# cell, appended to $GRID_OUT. Has its own grid/engines/common.rs -- tools/common.rs
# reads the per-rung manifest shape and stays the #[path] target of the examples
# above.
[[example]]
name = "grid_glmm"
path = "grid/engines/glmm.rs"
