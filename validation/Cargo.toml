[package]
name = "validation"
# Lockstep with the crate: must equal GLMM/Cargo.toml [package] version.
# glmm.rs stamps CARGO_PKG_VERSION into each result JSON's engine_version, and
# after the move that macro reads THIS manifest, not glmm's.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Dev/CI-only cross-language oracle harness — never distributed. Being a nested
# package is also what keeps everything under validation/ out of `cargo package
# -p glmm`: Cargo never descends into a subdirectory with its own Cargo.toml.
publish = false

# No lib/bin — this package exists only to own the four oracle example targets
# below (examples satisfy Cargo's at-least-one-target requirement).

# `formula` — the drivers lower R-style formulas; `loop_advanced` — theta_eval
# drives the dev-only seam. Enabled here on the dep rather than per-example
# `required-features` so all four examples always build (and stay under the
# workspace clippy deny gate) in `cargo clippy --workspace --all-targets`.
[dependencies]
glmm = { path = "..", features = ["formula", "loop_advanced"] }

# No `parallel` passthrough: every engine target here fits serial, including the
# VALIDATION_AGQ pass (engines/glmm.rs). The one example that wants inner
# parallelism, campaigns/speed-grid/agq_par_probe.rs, asks for it on the dependency
# directly (`--features glmm/parallel`, see its header).

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

# The glmm side of the cross-language validation suite. Kept at engines/glmm.rs
# (where the design and run.sh name it) rather than the default examples/ dir;
# run by run.sh's "rust" engine entry (`cargo run -p validation --example validation_fit`).
[[example]]
name = "validation_fit"
path = "engines/glmm.rs"

# The glmm side of the optimizer-grid campaign (campaigns/speed-grid/manifest.json,
# 510 cells): one JSONL record per cell, appended to $GRID_OUT. Shares
# common.rs with validation_fit above.
[[example]]
name = "grid_fit"
path = "campaigns/speed-grid/fit.rs"

# Mismatch-adjudication driver (oracle spec 2026-07-11): evaluates/minimizes
# the LMM profiled-REML objective at caller-chosen θ/schedules through the
# dev-only loop_advanced seam. Shares common.rs with the two above.
[[example]]
name = "theta_eval"
path = "campaigns/speed-grid/theta_eval.rs"

# Fits one memory-measurement model (validation/memory/models.json + gen_models.py)
# from a CSV path + formula string, for the memory harness (memory/memory.sh) to
# wrap in `/usr/bin/time -f '%M'`. Shares common.rs with the three examples above.
# NOT a validation rung -- see memory/models.json's header.
[[example]]
name = "memory_fit"
path = "memory/memory_fit.rs"

# Scratch AGQ parallel_inner probe (see its header). Temporary — delete this
# entry and the file once the parallel-default question is answered.
[[example]]
name = "agq_par_probe"
path = "campaigns/speed-grid/agq_par_probe.rs"
