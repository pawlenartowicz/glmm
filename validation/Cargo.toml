[package]
name = "validation"
# Lockstep with the crate: must equal GLMM/Cargo.toml [package] version.
# grid/engines/glmm.rs stamps CARGO_PKG_VERSION into each result record's
# engine_version, and that macro reads THIS manifest, not glmm's.
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Dev/CI-only cross-language oracle harness — never distributed. Being a nested
# package is also what keeps everything under validation/ out of `cargo package
# -p glmm`: Cargo never descends into a subdirectory with its own Cargo.toml.
publish = false

# No lib/bin — this package exists only to own the example targets below (examples
# satisfy Cargo's at-least-one-target requirement).

# `formula`: the drivers lower R-style formulas. `orchestrate`: the anova port
# gate's Rust front end calls the ports' own entry points (`run_fit`,
# `run_compare`). Both are enabled here on the dep rather than per-example
# `required-features` so every example always builds (and stays under the
# workspace clippy deny gate) in `cargo clippy --workspace --all-targets`; the
# workspace members glmm-python and glmm-r turn `orchestrate` on already.
[dependencies]
glmm = { path = "..", features = ["formula", "orchestrate"] }

# Dev-only pass-through of the kernel's optimizer counters, for the speed
# grid's counter pass. OFF by default: the counters perturb wall time
# slightly, and every other pass of this campaign reads wall time.
[features]
counters = ["glmm/counters"]
# The loop tier (`glmm::loop_advanced`), for the speed campaign's loop_bench
# example only (its `required-features`). A passthrough, not enabled on the
# dependency, so a workspace build never turns the unstable surface on.
loop_advanced = ["glmm/loop_advanced"]
# loop_bench's OS counters: per-fit thread CPU time, instructions and cycles
# (macOS), the block's getrusage CPU and peak RSS. Three libc calls in a
# cfg-gated module, the only `unsafe` in this package; off by default, so a
# default build has no direct libc dependency and no `unsafe`, and the records
# carry wall time with the counter fields null. Speed runs turn it on.
os_counters = ["dep:libc"]

# No `parallel` passthrough: every example here fits serial. The one that wants
# inner parallelism, campaigns/speed-campaign/agq_par_probe.rs, asks for it on the
# dependency directly (`--features glmm/parallel`, see its header).

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# loop_bench's per-fit CPU time, instructions and cycles (getrusage,
# clock_gettime, proc_pid_rusage), only with the `os_counters` feature.
# Already in Cargo.lock through the crate's own dependency tree; never a
# dependency of glmm itself.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[lints]
workspace = true

# The glmm side of the optimizer-grid campaign (campaigns/speed-campaign/manifest.json,
# 585 cells): one JSONL record per cell, appended to $GRID_OUT. Shares
# tools/common.rs with the examples below.
[[example]]
name = "grid_fit"
path = "campaigns/speed-campaign/fit.rs"

# Fits one memory-measurement model (tools/memory/models.json + gen_models.py) from a
# CSV path + formula string, for the memory harness (tools/memory/memory.sh) to wrap
# in `/usr/bin/time -f '%M'`. Not a validation gate -- see tools/memory/models.json's
# header.
[[example]]
name = "memory_fit"
path = "tools/memory/memory_fit.rs"

# AGQ parallel_inner probe (see its header).
[[example]]
name = "agq_par_probe"
path = "campaigns/speed-campaign/agq_par_probe.rs"

# Machine-local "what moved" report: fits all 49 manifest rungs and writes
# tools/bit_identity/<config>.json (rung, deviance, theta, beta, se_hessian, se_rx,
# n_eval, converged, singular), not committed. See tools/bit_identity/dump.rs's
# header for the config commands.
[[example]]
name = "bit_identity"
path = "tools/bit_identity/dump.rs"

# The glmm side of the accuracy grid (grid/manifest.json): one JSONL record per
# cell, appended to $GRID_OUT. Has its own grid/engines/common.rs -- tools/common.rs
# reads the per-rung manifest shape and stays the #[path] target of the examples
# above.
[[example]]
name = "grid_glmm"
path = "grid/engines/glmm.rs"

# Loop-tier benchmark: one workspace per shape, D simulated draws refitted on
# it, one JSONL record per fit (campaigns/speed-campaign/README.md, "loop_bench").
# Build with `--features loop_advanced` (and `counters` for the count runs).
[[example]]
name = "loop_bench"
path = "campaigns/speed-campaign/loop_bench.rs"
required-features = ["loop_advanced"]

# The anova port gate's Rust front end (tools/anova_ports/): one fixed list of
# model comparisons and per-term tables, one JSONL row per table cell on
# stdout, compared against the Python and R ports by
# tools/anova_ports/compare_anova_ports.R.
[[example]]
name = "anova_ports"
path = "tools/anova_ports/anova_ports.rs"
