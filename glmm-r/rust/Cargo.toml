[package]
name = "glmm-r"
version = "0.9.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "extendr binding for the glmm crate: the one #[extendr] entry point over glmm-bind, re-exported by GLMM/glmm-r/src/rust into the fastglmm R package."

[lib]
crate-type = ["rlib"]

[dependencies]
extendr-api = "0.9"
glmm-bind = { path = "../../glmm-bind" }

[lints]
workspace = true
