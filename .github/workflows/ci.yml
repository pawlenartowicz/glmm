name: CI

# Lint, the full #[test] suite across feature configs, plus the three gates a
# standalone publishable crate needs: an MSRV floor check, a wasm compile (the
# crate ships a cfg(wasm32) faer split), and a publish dry-run so `main` is always
# in a releasable state. Also builds and checks the fastglmm R package.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Let release.yml reuse these exact gates before publishing (single source of truth).
  workflow_call:

# Newer pushes supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── fmt + clippy + the regex-free-kernel guard, on stable ─────────────────
  # Split out from the #[test] suite so the four feature-variant test runs can
  # go wide in a matrix (below) instead of recompiling serially behind clippy.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        # The crate's workspace lints set clippy::all = deny, so a plain clippy
        # run is the correctness gate — no extra `-- -D warnings` needed.
        run: cargo clippy --all-targets
      - name: guard — the default-off kernel links no regex
        # `formula` is on by default (semver-covered surface), so the kernel's
        # regex-free property is no longer structural — this assertion IS the
        # guarantee.
        run: |
          if cargo tree -e normal -p glmm --no-default-features | grep -q regex; then
            echo "::error::default-off kernel pulls in regex — the formula feature is leaking"
            cargo tree -e normal -p glmm --no-default-features | grep -B5 regex
            exit 1
          fi
          echo "Kernel is regex-free with default features off."

  # ── the full #[test] suite across all four feature configs, in parallel ───
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The dhat bounded-allocation gates assert exact alloc counts; faer/rayon
      # multi-thread jitter perturbs them, so pin the pool to one thread.
      RAYON_NUM_THREADS: 1
    strategy:
      # A failing feature config must not cancel the others — we want every
      # leg's result on one push, not just the first to break.
      fail-fast: false
      matrix:
        # Each entry is one recompile-and-test on its own runner:
        #   default        — the semver-covered surface.
        #   loop_advanced  — unstable scratch-explicit surface, off by default;
        #                    must still compile+pass so the hot-path consumer
        #                    never breaks silently.
        #   parallel       — rayon in-fit parallelism (AGQ cluster loop), off by
        #                    default; includes the bit-identity test pinning it
        #                    to the serial path's exact output.
        #   no-default     — the parse-once/fit-many formula-free kernel; the
        #                    formula tests are #![cfg(feature = "formula")] and
        #                    skip themselves.
        #   counters       — dev-only evaluation/PIRLS counters, off by default
        #                    and cfg'd out entirely without the feature, so no
        #                    other leg even compiles this code; fit output is
        #                    pinned bit-identical with the feature on.
        #   orchestrate    — string-typed fit orchestration shared by the FFI
        #                    ports, off by default; not exercised by any other
        #                    leg, so its own tests need this one.
        include:
          - { name: default, flags: "" }
          - { name: loop_advanced, flags: "--features loop_advanced" }
          - { name: parallel, flags: "--features parallel" }
          - { name: no-default, flags: "--no-default-features" }
          - { name: counters, flags: "--features counters" }
          - { name: orchestrate, flags: "--features orchestrate" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (${{ matrix.name }})
        # --no-fail-fast: every target reports, so an integration test is not
        # hidden behind a failing lib target.
        run: cargo test --no-fail-fast ${{ matrix.flags }}

  # ── MSRV floor: the bobyqa dep pins rust-version = 1.85 ───────────────────
  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # ── wasm: keep the cfg(wasm32) faer config honest ─────────────────────────
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown
      - name: check (parallel feature, must be inert on wasm)
        # rayon is target-dep-excluded on wasm32, so the feature must compile to
        # a no-op here, never pull rayon in or break the build.
        run: cargo check --target wasm32-unknown-unknown --features parallel

  # ── package: gate the publishable state on every push ─────────────────────
  package:
    name: publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run

  # ── r: build the fastglmm source tarball and run R CMD check on it ────────
  # Independent of the Rust/Python jobs above: it builds the tarball
  # r-universe users get (see r/tools/cran-tarball.sh), not the workspace
  # crate directly.
  r:
    name: r (fastglmm package)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No test calls skip_on_cran(); the live lme4 comparison lives in
      # r/tools/acceptance-vs-lme4.R and is run by hand. This stays set
      # so that a skip_on_cran() added later cannot silently skip here; the
      # "fail on any skipped test" step below is what notices.
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: guard — no external statistics engine in the R package
        # CI checks this package against saved numbers, never against a live
        # lme4/glmmTMB/GLMMadaptive fit, and none of the three is installed on
        # the runner. This step is what keeps it that way.
        #
        # The test suite is greped for CALLS; R/ only for a LOAD. Roxygen prose
        # in R/ and man/ mentions lme4:: to say which convention a value
        # follows, and a sentence in a comment is documentation, not a
        # dependency. r/tools/ is deliberately NOT greped: the live comparison
        # acceptance-vs-lme4.R lives there, is run by hand, and .Rbuildignore
        # keeps it out of the built tarball.
        run: |
          if grep -rnE 'lme4::|glmmTMB::|GLMMadaptive::' r/tests/; then
            echo "::error::an R test calls an external statistics package — CI must check against saved numbers"
            exit 1
          fi
          if grep -rnE 'library\((lme4|glmmTMB|GLMMadaptive)\)|require(Namespace)?\(.?(lme4|glmmTMB|GLMMadaptive)' r/R/; then
            echo "::error::the R package's own code loads an external statistics package"
            exit 1
          fi
          echo "No external statistics engine is called by r/tests/ or loaded by r/R/."
      - uses: dtolnay/rust-toolchain@stable
      # The real compile happens later, inside the unpacked tarball under
      # $RUNNER_TEMP — a path that does not exist yet and has no stable
      # lockfile to key on. Default settings still warm ~/.cargo's registry
      # and git caches, which that later compile does share.
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
      - name: Build source tarball (self-contained, un-vendored)
        # Runs from a scratch directory so the tarball never lands in the
        # source tree; cran-tarball.sh finds the repo from its own path.
        run: |
          mkdir -p "$RUNNER_TEMP/r-build"
          (cd "$RUNNER_TEMP/r-build" && "$GITHUB_WORKSPACE/r/tools/cran-tarball.sh")
      - name: R CMD check
        # Also run from a scratch directory, for the same reason. Not
        # --as-cran: that mode adds a "Rust compilation" check that reports a
        # WARNING on this un-vendored tarball (it downloads crates), and the
        # step below fails on any WARNING. The vendored CRAN artifact is
        # checked with --as-cran by hand (r/tools/cran-tarball.sh --vendor).
        # --no-manual: the runner has no TeX, so a PDF manual is not
        # something to check here.
        run: |
          mkdir -p "$RUNNER_TEMP/r-check"
          cd "$RUNNER_TEMP/r-check"
          R CMD check --no-manual "$RUNNER_TEMP"/r-build/fastglmm_*.tar.gz
      - name: Fail on a check WARNING
        # R CMD check's own exit code only goes non-zero on a check ERROR
        # (Log$errors > 0); a WARNING passes silently. Read the final Status
        # line from the check log instead. A NOTE does not fail this step.
        run: |
          log="$RUNNER_TEMP/r-check/fastglmm.Rcheck/00check.log"
          if [ ! -f "$log" ]; then
            echo "::error::00check.log not found at $log — the check step did not produce a log"
            exit 1
          fi
          status=$(grep "^Status:" "$log" || true)
          if [ -z "$status" ]; then
            echo "::error::no Status: line in $log — the check log looks incomplete"
            exit 1
          fi
          if echo "$status" | grep -q WARNING; then
            echo "::error::R CMD check reported a WARNING: $status"
            exit 1
          fi
      - name: Fail on any skipped test
        # R CMD check does not fail its exit code on a skip, only on a real
        # error — so a missing lme4/broom or a misfired skip_on_cran() would
        # otherwise pass quietly.
        run: |
          out="$RUNNER_TEMP/r-check/fastglmm.Rcheck/tests/testthat.Rout"
          if [ ! -f "$out" ]; then
            echo "::error::testthat.Rout not found at $out — the check step did not run the test suite"
            exit 1
          fi
          if grep -qE "SKIP [1-9]" "$out"; then
            echo "::error::testthat skipped a test — treating as a job setup error"
            grep -A6 "Skipped tests" "$out" || true
            exit 1
          fi

  # ── python: build the glmm wheel, install it, test + lint ───────
  python:
    name: python (glmm wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel (abi3, Linux x86_64)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist
      - name: Install the built wheel (non-editable, catches packaging mistakes)
        run: pip install --find-links python/dist glmm
      - name: Install test + lint deps
        # ruff pinned so a new release's rule/formatter changes can't break CI
        # mid-release (0.16.0 did exactly that); bump deliberately. pandas and
        # pyarrow are not package dependencies — they are installed here only
        # so the pandas-categorical `.cat`-accessor branch and the pyarrow
        # Table/ChunkedArray branches run under test instead of skipping
        # themselves.
        run: pip install pytest pandas pyarrow ruff==0.16.0
      - name: pytest against the installed wheel, run outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/python/tests" -v
      - name: ruff check
        run: ruff check python/
      - name: ruff format --check
        run: ruff format --check python/

  # ── port-gate: the three front ends must agree to round-off ───────────────
  # glmm (Rust), the Python wheel and the fastglmm R package all drive the SAME
  # kernel, so on the same cells they must produce the same numbers to
  # round-off, not merely inside a cross-engine band. A miss is a wiring bug in
  # a binding — an argument dropped, a factor coded differently, a matrix
  # transposed — which is exactly the class of bug no single-language test can
  # see.
  #
  # It runs the accuracy grid's `fast` subset (83 cells) through all three, then
  # compares with the grid's own comparator. No statistics package is installed:
  # --ports-only skips every oracle lookup, and jsonlite and Rcpp (compiler
  # glue, not a statistics engine) are the only R dependencies it has.
  #
  # This is the one job that builds the `validation` crate.
  port-gate:
    name: port-gate (Rust vs Python vs R)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel (the same build the python job makes)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist
      - name: Install the wheel into python/venv
        # run.sh drives the port through python/venv/bin/python by name, so the
        # venv is where the wheel has to land.
        run: |
          python -m venv python/venv
          python/venv/bin/pip install --no-index --find-links python/dist glmm
      - uses: r-lib/actions/setup-r@v2
        with:
          # Posit's public package manager serves Linux binaries, so jsonlite
          # installs in seconds instead of compiling.
          use-public-rspm: true
      - name: Install the R dependencies (no statistics package)
        # jsonlite: read by the grid's R engine and by compare.R.
        # generics: an Import of fastglmm, needed to install it.
        # Rcpp: compiles the strtod shim in engines/glmm_r.R, not a statistics engine.
        run: Rscript -e 'install.packages(c("jsonlite", "generics", "Rcpp"))'
      - name: Install fastglmm from source
        # Straight from the checkout: r/configure writes src/Makevars and
        # r/src/rust's path dependency on ../../../glmm-r resolves here. The
        # CRAN-shaped tarball (r/tools/cran-tarball.sh) is the r job's business,
        # not this one's.
        run: R CMD INSTALL r
      - name: Build the grid's glmm engine
        # Outside run.sh so a compile error is its own red step rather than a
        # watchdog timeout.
        run: cargo build --release -p validation --example grid_glmm
      - name: Fit the fast subset through all three front ends
        # --jobs=1: one worker, pinned to core 0. The runner has no P-core/E-core
        # split to respect and the fast subset is a couple of seconds of fitting.
        run: |
          validation/grid/run.sh glmm        --fast --jobs=1 --label ci
          validation/grid/run.sh glmm_python --fast --jobs=1 --label ci
          validation/grid/run.sh glmm_r      --fast --jobs=1 --label ci
      - name: Port gate
        # --glmm-run= is REQUIRED, not decoration. compare.R prefers a run with
        # subset "full", and the committed release baseline in the checkout is
        # one; without this flag the gate would compare CI-built ports against a
        # run fitted on another machine at a 1e-12 band.
        run: |
          run=$(echo validation/grid/runs/glmm/scratch/*_ci)
          if [ ! -d "$run" ]; then
            echo "::error::expected exactly one glmm run directory from this job, found: $run"
            exit 1
          fi
          Rscript validation/grid/compare.R --ports-only --glmm-run="$run"
