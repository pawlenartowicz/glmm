[package]
name = "glmm-formula"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "R-style formula frontend for `glmm`: lowers a formula + data table into the design matrix, ModelSpec, GroupIds and FitOptions the fit kernel consumes."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
# The kernel this frontend feeds. Dependency direction is one-way: glmm never
# links glmm-formula, so the parse-once/fit-many hot path never pulls in `regex`.
glmm = { path = ".." }
# The mirrored MCPower parser is regex-driven (RE_NESTED/RE_SLOPE/… LazyLock
# statics). Only new third-party dep — no serde (the AST wire form is deferred).
regex = "1"

[dev-dependencies]
# Test-only: read the frozen lme4 goldens directly (oracle-is-sacred) instead of
# hand-transcribing numbers. Not part of the shipped dep surface. Mirrors glmm's
# own dev-deps.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
