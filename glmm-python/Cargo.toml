[package]
name = "glmm-python"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "PyO3 binding for the glmm crate — builds the glmm._native extension consumed by GLMM/python/glmm."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
glmm = { path = ".." }

[lints]
workspace = true
